<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlueTeam Hub</title>
<!-- Əsas səhifə: yalnız görünüş (CSS). Menyuların məzmunu modules/*/page.js fayllarındadır. -->
<style>
:root{--bg:#0f1419;--p:#171d25;--b:#263040;--t:#e6edf3;--m:#8b98a8;--a:#3b9eff}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;height:100vh}
nav{width:250px;background:var(--p);border-right:1px solid var(--b);overflow:auto;padding:12px 0;flex-shrink:0}nav h1{font-size:16px;padding:0 16px 10px;margin:0}
nav a{display:block;padding:9px 16px;color:var(--m);cursor:pointer}nav a:hover,nav a.on{background:#1f2833;color:var(--t)}nav hr{border:0;border-top:1px solid var(--b);margin:8px 0}
main{flex:1;padding:22px;overflow:auto}h2{margin-top:0}input,textarea{width:100%;background:var(--bg);border:1px solid var(--b);color:var(--t);padding:8px;border-radius:6px;margin:4px 0 12px}
button{background:var(--a);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;margin:0 6px 6px 0}button.g{background:#2a3442}button.r{background:#c0392b}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:14px;cursor:pointer}
.up{color:#3fb950}.dn{color:#f85149}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--b);text-align:left}
iframe{width:100%;height:70vh;border:1px solid var(--b);border-radius:6px;margin-top:12px;background:#fff}pre{background:var(--p);padding:12px;overflow:auto;max-height:50vh}#login{margin:15vh auto;width:320px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:0 12px;height:42px;background:var(--p);border-bottom:1px solid var(--b)}.bar button{margin:0 0 0 6px;padding:5px 10px}iframe.full{width:100%;height:calc(100vh - 42px);border:0;margin:0;border-radius:0;display:block}
</style></head><body><div id="app" style="display:flex;width:100%"></div><script src="/app.js"></script></body></html>
